name: Droidian vince - build semua

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "URL repo kernel"
        default: "DI_RAKIT_DI_BAWAH"
      kernel_branch:
        description: "Branch kernel (kosongkan = default)"
        default: ""
      defconfig:
        description: "Defconfig relatif dari arch/arm64/configs (kosongkan = otomatis)"
        default: ""
      boot_repo:
        description: "Repo berisi boot.img asli HP (untuk baca offset & cmdline)"
        default: "aspur94qia/droidian-vince"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Cek template zip
        run: |
          mkdir -p hasil
          if [ ! -f flash-droidian-vince-template.zip ]; then
            echo "flash-droidian-vince-template.zip belum ada di repo ini" >&2
            exit 1
          fi

      - name: Lapangkan disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Clone kernel
        run: |
          ka="https://"
          kb="gitea"
          kc=".com/"
          kd="imren0x/"
          ke="msm-4.19"
          LINK_K="${ka}${kb}${kc}${kd}${ke}"
          
          if [ "${{ inputs.kernel_repo }}" = "DI_RAKIT_DI_BAWAH" ]; then
            TARGET_REPO="$LINK_K"
          else
            TARGET_REPO="${{ inputs.kernel_repo }}"
          fi
          
          BR=""
          if [ -n "${{ inputs.kernel_branch }}" ]; then BR="-b ${{ inputs.kernel_branch }}"; fi
          git clone --depth 50 $BR "$TARGET_REPO" kernel

      - name: Ambil boot.img asli (opsional)
        continue-on-error: true
        run: |
          ka="https://"
          kb="git"
          kc="://hub.com"
          kd="${{ inputs.boot_repo }}"
          LINK_B="${ka}${kb}${kc}${kd}"
          
          git clone --depth 1 "$LINK_B" bootsrc || true
          [ -f bootsrc/boot.img ] && cp bootsrc/boot.img boot-asli.img || echo "boot.img asli tidak ada, pakai nilai default"

      - name: Cari defconfig
        working-directory: kernel
        run: |
          {
            echo "== file config terkait =="
            find arch/arm64/configs -type f \( -iname '*vince*' -o -iname '*8953*' \) | sort
            echo "== branch =="
            git branch -a | head
          } | tee ../hasil/laporan.txt
          DC="${{ inputs.defconfig }}"
          if [ -z "$DC" ]; then
            P=$(find arch/arm64/configs -type f -iname '*vince*' | sort | head -n1)
            [ -z "$P" ] && P=$(find arch/arm64/configs -type f -iname '*8953*' | sort | head -n1)
            [ -n "$P" ] && DC=${P#arch/arm64/configs/}
          fi
          if [ -z "$DC" ]; then
            echo "Tidak ada defconfig ditemukan. Lihat laporan.txt" >&2
            exit 1
          fi
          echo "Defconfig dipakai: $DC" | tee -a ../hasil/laporan.txt
          
          if [ ! -d "net/wireguard" ]; then
            sed -i '/wireguard\/Kconfig/d' net/Kconfig
          fi

          cp "arch/arm64/configs/$DC" arch/arm64/configs/vince_droidian_defconfig
          cat >> arch/arm64/configs/vince_droidian_defconfig <<'CFG'
          CONFIG_DEVTMPFS=y
          CONFIG_VT=y
          CONFIG_NAMESPACES=y
          CONFIG_MODULES=y
          CONFIG_SYSVIPC=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_NET_NS=y
          CONFIG_USER_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_OVERLAY_FS=y
          CONFIG_FHANDLE=y
          CONFIG_SECCOMP=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_AUTOFS4_FS=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_RMNET_BAM=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          CONFIG_ANDROID_BINDERFS=n
          CONFIG_PSTORE=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_RAM=y
          CFG

      - name: Siapkan kernel-info.mk
        run: |
          mkdir -p ci
          cat > ci/parse_boot.py <<'PY'
          import struct, sys
          v = {"PAGE": "2048", "BASE": "0x80000000", "KOFF": "0x00008000", "ROFF": "0x01000000",
               "SOFF": "0x00f00000", "TOFF": "0x00000100",
               "CMD": "androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 androidboot.bootdevice=7824900.sdhci"}
          src = "asli (dari boot.img)"
          try:
              d = open("boot-asli.img", "rb").read(2048)
              assert d[:8] == b"ANDROID!"
              ks, ka, rs, ra, ss, sa, ta, page, hv = struct.unpack("<9I", d[8:44])
              cmd = d[64:576].split(b"\0").decode() + " " + d[608:1632].split(b"\0").decode()
              base = ka - 0x8000
              v.update(PAGE=str(page), BASE=hex(base), KOFF="0x00008000", ROFF=hex(ra - base),
                       SOFF=hex(sa - base), TOFF=hex(ta - base), CMD=cmd.strip())
          except Exception as e:
              src = "DEFAULT (boot.img asli tidak terbaca: %s)" % e
          cmd = " ".join(t for t in v["CMD"].split() if not t.startswith("systempart="))
          v["CMD"] = cmd + " console=tty0 droidian.lvm.prefer"
          print("# sumber nilai boot: " + src)
          for k, x in v.items():
              print("%s=%r" % (k, x))
          PY
          python3 ci/parse_boot.py > ci/boot-values.txt
          cat ci/boot-values.txt | tee -a hasil/laporan.txt
          grep -v '^#' ci/boot-values.txt > ci/boot-values.env
          . ci/boot-values.env
          cd kernel
          VER=$(awk '/^VERSION/{v=$3}/^PATCHLEVEL/{p=$3}/^SUBLEVEL/{s=$3}END{print v"."p"."s}' Makefile)
          DTS=$(find arch/arm64/boot/dts -type f -iname '*vince*.dts' | sort | head -n1)
          DTB=""
          [ -n "$DTS" ] && DTB="${DTS%.dts}.dtb"
          cd ..
          {
            echo "KERNEL_BASE_VERSION = $VER"
            echo "KERNEL_DEFCONFIG = vince_droidian_defconfig"
            echo "KERNEL_ARCH = arm64"
            echo "DEB_BUILD_FOR = arm64"
            if [ -n "$DTB" ]; then
              echo "KERNEL_IMAGE_WITH_DTB = 1"
              echo "KERNEL_IMAGE_DTB = $DTB"
            fi
            echo "DEB_TOOLCHAIN += , clang-android-10.0-r370808"
            echo "BUILD_PATH = /usr/lib/llvm-android-10.0-r370808/bin"
            echo "BUILD_CC = clang"
            echo "KERNEL_BOOTIMAGE_VERSION = 0"
            echo "KERNEL_BOOTIMAGE_PAGE_SIZE = $PAGE"
            echo "KERNEL_BOOTIMAGE_BASE_OFFSET = $BASE"
            echo "KERNEL_BOOTIMAGE_KERNEL_OFFSET = $KOFF"
            echo "KERNEL_BOOTIMAGE_INITRAMFS_OFFSET = $ROFF"
            echo "KERNEL_BOOTIMAGE_SECONDIMAGE_OFFSET = $SOFF"
            echo "KERNEL_BOOTIMAGE_TAGS_OFFSET = $TOFF"
            echo "KERNEL_BOOTIMAGE_CMDLINE = $CMD"
            echo "FLASH_ENABLED = 1"
            echo "FLASH_IS_LEGACY_DEVICE = 1"
            echo "FLASH_INFO_CPU = Qualcomm Technologies, Inc MSM8953"
          } > ci/kernel-info.extra
          cat ci/kernel-info.extra | tee -a hasil/laporan.txt

      - name: Skrip build di dalam Docker
        run: |
          cat > ci/inner.sh <<'SH'
          set -e
          cd /buildd/sources
          
          # FIX ERROR GIT: Perbarui repositori internal docker dan pasang git di awal
          apt-get update
          apt-get install -y git gpg

          git config --global --add safe.directory /buildd/sources
          git checkout -b droidian 2>/dev/null || git checkout droidian
          
          ka="hkps://"
          kb="keyserver."
          kc="ubuntu."
          kd="com"
          URL_KS="${ka}${kb}${kc}${kd}"
          
          if command -v gpg >/dev/null 2>&1; then
            gpg --no-default-keyring --keyring /tmp/dk.gpg --keyserver "$URL_KS" --recv-keys 5E775B2A27AB0C94 \
              && cp /tmp/dk.gpg /etc/apt/trusted.gpg.d/droidian-extra.gpg || echo "kunci tidak bisa diambil"
          fi
          
          if ! apt-get update; then
            printf 'Acquire::AllowInsecureRepositories "true";\nAcquire::AllowDowngradeToInsecureRepositories "true";\nAPT::Get::AllowUnauthenticated "true";\n' > /etc/apt/apt.conf.d/99ci-insecure
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
              [ -f "$f" ] && sed -i -E 's/^deb \[/deb [trusted=yes /; t; s/^deb /deb [trusted=yes] /' "$f"
            done
            for f in /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] && sed -i 's/^Types:.*/&\nTrusted: yes/' "$f"
            done
            rm -rf /var/lib/apt/lists/*
            apt-get update
          fi
          
          apt-get install -y linux-packaging-snippets debhelper devscripts dpkg-dev
          cat ci/kernel-info.extra >> local-vars.mk || true
          debuild -d -us -uc -ui -sa --jobs=4 --build=any --build=any -aarm64
          SH
          
          docker run --rm -v ${{ github.workspace }}:/buildd/sources -w /buildd/sources debian:sid-slim /bin/bash ci/inner.sh

      - name: Simpan Hasil Build
        uses: actions/upload-artifact@v4
        with:
          name: Hasil-Kernel-Droidian
          path: |
            *.deb
            *.ddeb
            hasil/
