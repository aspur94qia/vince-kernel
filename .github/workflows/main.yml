name: Droidian vince - build semua
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan lingkungan kerja
        run: |
          mkdir -p hasil packages ci
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Cari dan Bedah boot.img Asli Repositori
        run: |
          if [ -f boot.img ]; then
            cp boot.img boot-asli.img
          elif [ -f boot/boot.img ]; then
            cp boot/boot.img boot-asli.img
          else
            echo 'PERINGATAN: boot.img tidak ditemukan, pakai cadangan default'
          fi
      - name: Cari dan Inject Defconfig A13
        run: |
          cp arch/arm64/configs/vince_defconfig arch/arm64/configs/vince_droidian_defconfig 2>/dev/null || cp arch/arm64/configs/msm8953_defconfig arch/arm64/configs/vince_droidian_defconfig
          cat >> arch/arm64/configs/vince_droidian_defconfig <<'CFG'
          CONFIG_DEVTMPFS=y
          CONFIG_VT=y
          CONFIG_NAMESPACES=y
          CONFIG_MODULES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_TMPFS_XATTR=y
          CFG
      - name: Ekstrak Parameter Boot Asli
        run: |
          cat > ci/parse_boot.py <<'PY'
          import struct, sys, os
          v = {"PAGE": "2048", "BASE": "0x80000000", "KOFF": "0x00008000", "ROFF": "0x01000000",
               "SOFF": "0x00f00000", "TOFF": "0x00000100",
               "CMD": "androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 androidboot.bootdevice=7824900.sdhci"}
          if os.path.exists("boot-asli.img"):
              try:
                  d = open("boot-asli.img", "rb").read(2048)
                      ks, ka, rs, ra, ss, sa, ta, page, hv = struct.unpack("<9I", d[8:44])
                      cmd = d[64:576].split(b"\0").decode() + " " + d[608:1632].split(b"\0").decode()
                      base = ka - 0x8000
                      v.update(PAGE=str(page), BASE=hex(base), KOFF="0x00008000", ROFF=hex(ra - base),
                               SOFF=hex(sa - base), TOFF=hex(ta - base), CMD=cmd.strip())
              except Exception as e: pass
          cmd = " ".join(t for t in v["CMD"].split() if not t.startswith("systempart="))
          v["CMD"] = cmd + " console=tty0 droidian.lvm.prefer"
          for k, x in v.items(): print("%s=%s" % (k, x))
          PY
          python3 ci/parse_boot.py > ci/boot-values.txt
          awk -F= '{print $1"=\"\伸2"\""}' ci/boot-values.txt > ci/boot-values.env
      - name: Siapkan kernel-info.mk
        run: |
          . ci/boot-values.env || true
          {
            echo "KERNEL_DEFCONFIG = vince_droidian_defconfig"
            echo "KERNEL_ARCH = arm64"
            echo "DEB_BUILD_FOR = arm64"
            echo "KERNEL_BOOTIMAGE_VERSION = 0"
            echo "KERNEL_BOOTIMAGE_PAGE_SIZE = \${PAGE:-2048}"
            echo "KERNEL_BOOTIMAGE_BASE_OFFSET = \${BASE:-0x80000000}"
            echo "KERNEL_BOOTIMAGE_KERNEL_OFFSET = \${KOFF:-0x00008000}"
            echo "KERNEL_BOOTIMAGE_INITRAMFS_OFFSET = \${ROFF:-0x01000000}"
            echo "KERNEL_BOOTIMAGE_SECONDIMAGE_OFFSET = \${SOFF:-0x00f00000}"
            echo "KERNEL_BOOTIMAGE_TAGS_OFFSET = \${TOFF:-0x00000100}"
            echo "KERNEL_BOOTIMAGE_CMDLINE = \${CMD:-androidboot.hardware=qcom console=tty0 droidian.lvm.prefer}"
          } > ci/kernel-info.extra
      - name: Skrip build di dalam Docker
        run: |
          cat > ci/inner.sh <<'SH'
          set -e
          cd /buildd/sources
          git config --global --add safe.directory /buildd/sources
          apt-get update && apt-get install -y linux-packaging-snippets python3-dev debhelper
          mkdir -p debian/source
          cp -v /usr/share/linux-packaging-snippets/kernel-info.mk.example debian/kernel-info.mk
          cat /ci/kernel-info.extra >> debian/kernel-info.mk
          rm -f debian/compat
          echo '3.0 (native)' > debian/source/format
          chmod +x debian/rules
          rm -f debian/control
          debian/rules debian/control
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm 'droidian packaging' || true
          RELENG_HOST_ARCH='arm64' releng-build-package
          SH
      - name: Build kernel + boot.img (Droidian)
        shell: bash
        run: |
          docker run --rm -v "$PWD/packages:/buildd" -v "$PWD:/buildd/sources" -v "$PWD/ci:/ci" quay.io/droidian/build-essential:trixie-amd64 bash /ci/inner.sh 2>&1 | tee hasil/build.log
      - name: Rakit paket zip flash
        if: success()
        run: |
          sudo chown -R "$USER" packages || true
          BOOT=$(find . packages -name boot.img 2>/dev/null | head -n1)
          cp "$BOOT" hasil/boot.img
          echo 'dummy' > dummy.txt && zip hasil/flash-droidian-vince.zip dummy.txt && rm dummy.txt
          zip -0 -g hasil/flash-droidian-vince.zip hasil/boot.img
          cp packages/*.deb hasil/ 2>/dev/null || true
      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidian-vince-full-pack
          path: hasil/
