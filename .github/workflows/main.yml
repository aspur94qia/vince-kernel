name: Droidian vince - build semua
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Lapangkan disk server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          mkdir -p hasil packages
      - name: Ekstrak parameter boot.img bawaan HP secara otomatis
        run: |
          if [ -f boot.img ]; then
            mkdir -p ci && cp boot.img ci/boot-asli.img
          fi
      - name: Jalankan Kompilasi Menggunakan Alat Resmi Droidian
        run: |
          docker run --rm -v "$PWD:/buildd/sources" -v "$PWD/packages:/buildd" quay.io/droidian/build-essential:trixie-amd64 bash -c '
            cd /buildd/sources
            git config --global --add safe.directory /buildd/sources
            echo "Acquire::AllowInsecureRepositories \"true\";" > /etc/apt/apt.conf.d/99bypass-gpg
            echo "Acquire::AllowDowngradeToInsecureRepositories \"true\";" >> /etc/apt/apt.conf.d/99bypass-gpg
            echo "APT::Get::AllowUnauthenticated \"true\";" >> /etc/apt/apt.conf.d/99bypass-gpg
            apt-get update || true
            apt-get install -y --allow-unauthenticated linux-packaging-snippets python3-dev debhelper crossbuild-essential-arm64 bc bison flex libssl-dev kmod libelf-dev
            git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "droidian build structural fix" || true
            RELENG_HOST_ARCH=arm64 releng-build-package
          '
      - name: Kemas berkas boot.img dan paket adaptasi ke dalam Zip
        run: |
          sudo chown -R "$USER" packages || true
          cp packages/*.deb hasil/ 2>/dev/null || true
          TARGET_IMG=$(find . -name "Image.gz*" 2>/dev/null | head -n 1)
          if [ -n "$TARGET_IMG" ]; then
            cp "$TARGET_IMG" hasil/boot.img
            zip -j hasil/flash-droidian-vince.zip hasil/boot.img
          else
            echo "Kompilasi kode mesin gagal atau tidak menghasilkan berkas output" > hasil/LOG-GAGAL.txt
          fi
      - name: Upload paket zip flash full untuk HP vince Anda
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: droidian-vince-full-pack
          path: hasil/
