name: Droidian vince - build semua
on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'URL repo kernel 4.9 vince'
        default: 'https://github.com'
      kernel_branch:
        description: 'Branch kernel 4.9'
        default: 'vince-4.9'
      defconfig:
        description: 'Nama file defconfig'
        default: 'vince_defconfig'
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan lingkungan kerja
        run: |
          mkdir -p hasil
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Clone kernel 4.9
        run: |
          BR=''
          if [ -n '${{ inputs.kernel_branch }}' ]; then BR='-b ${{ inputs.kernel_branch }}'; fi
          git clone --depth 50 $BR '${{ inputs.kernel_repo }}' kernel
      - name: Ambil Komponen Adaptasi Device
        run: |
          git clone --depth 1 'https://github.com' device/xiaomi/vince || true
      - name: Cari dan Inject Defconfig A13
        working-directory: kernel
        run: |
          DC='${{ inputs.defconfig }}'
          cp arch/arm64/configs/$DC arch/arm64/configs/vince_droidian_defconfig 2>/dev/null || cp arch/arm64/configs/msm8953_defconfig arch/arm64/configs/vince_droidian_defconfig
          cat >> arch/arm64/configs/vince_droidian_defconfig <<'CFG'
          CONFIG_DEVTMPFS=y
          CONFIG_VT=y
          CONFIG_NAMESPACES=y
          CONFIG_MODULES=y
          CONFIG_OVERLAY_FS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_TMPFS_XATTR=y
          CFG
      - name: Siapkan kernel-info.mk
        run: |
          mkdir -p ci
          echo 'KERNEL_DEFCONFIG = vince_droidian_defconfig' > ci/kernel-info.extra
          echo 'KERNEL_ARCH = arm64' >> ci/kernel-info.extra
      - name: Skrip build di dalam Docker
        run: |
          cat > ci/inner.sh <<'SH'
          set -e
          cd /buildd/sources
          git config --global --add safe.directory /buildd/sources
          git checkout -b droidian 2>/dev/null || git checkout droidian
          apt-get update && apt-get install -y linux-packaging-snippets python3-dev debhelper
          mkdir -p debian/source
          cp -v /usr/share/linux-packaging-snippets/kernel-info.mk.example debian/kernel-info.mk
          cat /ci/kernel-info.extra >> debian/kernel-info.mk
          rm -f debian/compat
          echo '3.0 (native)' > debian/source/format
          chmod +x debian/rules
          rm -f debian/control
          debian/rules debian/control
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm 'droidian packaging' || true
          RELENG_HOST_ARCH='arm64' releng-build-package
          SH
      - name: Build kernel + boot.img (Droidian)
        shell: bash
        run: |
          mkdir -p packages
          docker run --rm -v "$PWD/packages:/buildd" -v "$PWD/kernel:/buildd/sources" -v "$PWD/ci:/ci" quay.io/droidian/build-essential:trixie-amd64 bash /ci/inner.sh 2>&1 | tee hasil/build.log
      - name: Rakit paket zip flash
        if: success()
        run: |
          sudo chown -R "$USER" packages kernel || true
          BOOT=$(find kernel packages -name boot.img 2>/dev/null | head -n1)
          cp "$BOOT" hasil/boot.img
          echo 'dummy' > dummy.txt && zip hasil/flash-droidian-vince.zip dummy.txt && rm dummy.txt
          zip -0 -g hasil/flash-droidian-vince.zip hasil/boot.img
          cp packages/*.deb hasil/ 2>/dev/null || true
      - name: Upload hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidian-vince-full-pack
          path: hasil/
