name: build-boot-vince-working
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 https://github.com/vatva691/android_kernel_xiaomi_msm8953-4.9 -b lineage-20.0 kernel
          cat kernel/arch/arm64/configs/vince-perf_defconfig > kernel/arch/arm64/configs/droidian_defconfig
          echo "
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_VT=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_OVERLAY_FS=y
          CONFIG_FHANDLE=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          " >> kernel/arch/arm64/configs/droidian_defconfig
      - run: |
          sudo apt update && sudo apt install -y gcc-10-aarch64-linux-gnu bc bison flex libssl-dev
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-gcc-10- droidian_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-gcc-10- -j$(nproc) Image.gz
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-gcc-10- -j$(nproc) dtbs
          cat arch/arm64/boot/Image.gz arch/arm64/boot/dts/qcom/msm8953-vince*.dtb > ../Image.gz-dtb
          cd ..
          echo "-- base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --cmdline androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 androidboot.bootdevice=7824900.sdhci droidian.lvm.prefer" > cmdline
          curl -L https://github.com/droidian-lk2nd/lk2nd/releases/download/0.14.0/lk2nd.img -o lk2nd.img
          # ramdisk kosong dulu, nanti diinject Droidian pas install rootfs
          echo -n | gzip > ramdisk.cpio.gz
          mkbootimg --kernel Image.gz-dtb --ramdisk ramdisk.cpio.gz --base 0x80000000 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 --pagesize 2048 --cmdline "androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 androidboot.bootdevice=7824900.sdhci droidian.lvm.prefer" -o boot-vince-A13-droidian.img
          ls -lh *.img
      - uses: actions/upload-artifact@v4
        with:
          name: boot-working-vince
          path: boot-vince-A13-droidian.img
